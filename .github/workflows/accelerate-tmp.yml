name: accelerate-tmp

# Temporary: proves the Accelerate arm of `bwbench compare solvers` on macos-15. Removed before merge.

on:
  push:
    branches: [feat-accelerate-arm]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accelerate:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      UV_EXCLUDE_NEWER: 1 week
      BWBENCH_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      - name: SDK and its LU
        run: |
          sw_vers
          xcrun --show-sdk-version
          clang --version | head -n 1
          sdk=$(xcrun --show-sdk-path)
          grep -rn "SparseFactorizationLU" "$sdk/System/Library/Frameworks/Accelerate.framework/" | head -n 20

      - run: brew install suite-sparse swig

      - name: Accelerate against a dense solve
        run: |
          PYTHONPATH=src uv run --no-project --python 3.13 --with numpy==2.5.3 --with scipy==1.18.1 python - <<'EOF'
          import bwbench
          import numpy as np
          from scipy import sparse
          from bwbench.solvers import accelerate, by_column
          rng = np.random.default_rng(1)
          n = 400
          a = sparse.random(n, n, density=0.02, random_state=rng, format="csr") + sparse.eye(n) * 4
          b = rng.standard_normal((n, 3))
          x = by_column(accelerate(a))(b)
          ref = np.linalg.solve(a.toarray(), b)
          # cond(a) is about 10 here: 1e-12 is far above round-off and far below a wrong solve.
          np.testing.assert_allclose(x, ref, rtol=1e-12, atol=1e-14, strict=True)
          print("max abs difference", np.abs(x - ref).max())
          EOF

      - name: bwbench compare solvers
        run: |
          start=$SECONDS
          PYTHONPATH=src uv run --no-project --python 3.13 python -m bwbench.compare compare solvers --rounds 3 \
            --tier hosted --machine "GitHub $ImageOS" --work "$RUNNER_TEMP/work" -o ratios/macOS.json
          echo "compare took $((SECONDS - start)) s"
          PYTHONPATH=src uv run --no-project --python 3.13 --with jsonschema==4.26.0 --with rfc3339-validator==0.1.4 \
            python -m bwbench.compare validate ratios/macOS.json
          jq '.comparisons[] | {ratios, arms: (.arms | map_values({solver, missing, seconds, versions}))}' ratios/macOS.json
          jq -e '.comparisons[0].arms.accelerate | .missing == null and .solver == "accelerate"' ratios/macOS.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ratios-macOS
          path: ratios/
