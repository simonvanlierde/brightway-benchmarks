name: compat

# `just compat` per Python (see the README). Unlike smoke.yml it follows new upstream releases.

on:
  schedule:
    - cron: "41 3 * * *" # daily 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  compat:
    name: Python ${{ matrix.python }} on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The benchmark code needs 3.12 or later (PEP 695 type aliases), though brightway25 allows 3.9.
        python: ["3.12", "3.13", "3.14"]
    env:
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.19"

      # box.sh falls back to a plain `docker run` here, which the runner has.
      - run: uvx --from rust-just==1.58.0 just compat "$PYTHON"

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Python $PYTHON"
            echo '```'
            grep -iE '^(brightway25|bw|matrix|numpy|scipy|pandas|peewee|pypardiso)' ".asv/compat/$PYTHON/requirements.txt" ||
              echo "no requirements.txt: the resolve failed"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: compat-${{ matrix.python }}
          path: .asv/compat/${{ matrix.python }}
          include-hidden-files: true # the files sit under .asv
          if-no-files-found: warn # the resolve itself can fail
