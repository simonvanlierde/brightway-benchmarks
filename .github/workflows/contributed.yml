name: contributed

# Checks the ratio files contributors add by pull request under ratios/contributed/
# (docs/running.md "Contribute a run"): the result file's shape and arithmetic, its
# fingerprint, and what a contribution needs on top (`bwbench validate --contribution`):
# ratios/contributed/<machine slug>/<YYYY-MM-DD>.json, tier "contributed", no default host
# name as the machine label, no user folder, at most 256 KiB, a regular file. It checks every
# file there, not only the new ones, so the folder stays valid as the rules tighten.

on:
  pull_request:
    paths:
      - ratios/contributed/**
      - .github/workflows/contributed.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate contributed ratios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      # `! -type d` passes symlinks too, so the validator refuses them.
      - name: bwbench validate --contribution
        shell: bash # pipefail, so a failing find fails the step
        run: |-
          [ -d ratios/contributed ] || exit 0
          find ratios/contributed ! -type d -print0 |
            xargs -0 --no-run-if-empty env PYTHONPATH=src uv run --no-project --python 3.13 \
              --with jsonschema==4.26.0 --with rfc3339-validator==0.1.4 \
              python -m bwbench.compare validate --contribution
