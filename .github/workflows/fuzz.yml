name: fuzz

# A short Atheris run of tests/fuzz_release_report.py on each pull request. The input is
# not untrusted: the point is the OpenSSF Scorecard Fuzzing check, not a security boundary.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: atheris
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.19"

      - run: uv run --no-project --python 3.12 --with atheris==3.1.0 python tests/fuzz_release_report.py -max_total_time=60
