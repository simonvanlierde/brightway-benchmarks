name: fuzz

# A short Atheris run of tests/fuzz_ratios.py on each pull request. The input is untrusted:
# `bwbench validate --contribution` reads result files that outside contributors send by pull
# request (the `contributed` workflow). The harness holds it to refusing a file, never crashing
# or hanging on one. It also satisfies the OpenSSF Scorecard Fuzzing check.

on:
  pull_request:
    paths:
      - src/bwbench/ratios.py
      - src/bwbench/ratios.schema.json
      - src/bwbench/fingerprint.py
      - src/bwbench/compare.py
      - tests/fuzz_ratios.py
      - tests/ratios_corpus.py
      - .github/workflows/fuzz.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: atheris
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.7"

      # -timeout: a file that makes the validator run for 10 s is a bug, as a crash is.
      - run: >-
          uv run --no-project --python 3.13 --with atheris==3.1.0 --with jsonschema==4.26.0
          --with rfc3339-validator==0.1.4 python tests/fuzz_ratios.py -max_total_time=60 -timeout=10
        env:
          PYTHONPATH: src
