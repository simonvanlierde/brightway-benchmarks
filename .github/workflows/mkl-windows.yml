name: mkl-windows

# `scripts/mkl_path_probe.py` on a Windows runner: pair PyPardiso's default MKL lookup against
# explicit `PYPARDISO_MKL_RT` in one environment, timing first score and a second demand after
# factorization. Run it by hand. Hosted runners share their machines, so read the paired ratio,
# not the absolute times. Synthetic smoke profile only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-mkl:
    name: MKL lookup on windows-latest
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      BWBENCH_THREADS: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.8"

      - name: Compare MKL lookup modes
        shell: bash
        run: |
          unset PYPARDISO_MKL_RT
          uv venv --python 3.13 .asv/windows-mkl
          uv pip install --python .asv/windows-mkl/Scripts/python.exe --exclude-newer 2026-11-22 \
            bw2calc==3.1.0 pypardiso==0.4.7 mkl==2026.2.1 scipy==1.18.1 numpy==2.5.4
          PYTHONPATH=src .asv/windows-mkl/Scripts/python.exe -m scripts.mkl_path_probe > mkl-path.json
          cat mkl-path.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-mkl-path
          path: mkl-path.json
          if-no-files-found: error
