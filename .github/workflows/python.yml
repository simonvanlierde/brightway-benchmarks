name: python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # No cache: the nightly compat jobs run released Brightway code on hosted runners,
          # and nothing they could write should feed this required check.
          enable-cache: false
          version: "0.12.19"

      - run: uv sync --locked
      # Checks every locked dependency, dev group included, against the OSV database
      # for known vulnerabilities and deprecated or quarantined projects. Experimental
      # in uv 0.12, hence the preview flag.
      - run: uv audit --locked --preview-features audit-command

      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest --cov # fails under 80% (`fail_under` in pyproject.toml)
