name: python

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is in the group because a queued run replaces a pending one in its group
  # whatever cancel-in-progress says, so a push to main must not wait beside the weekly run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Only a newer push to the same pull request cancels a run. A push to main must not cancel
  # the weekly scheduled run, or that week's revision report is lost.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv checks every package against OSV's malware advisories before its code
  # runs, and fails if OSV is unreachable. The preview flag only silences the
  # "experimental" warning.
  UV_MALWARE_CHECK: "1"
  UV_PREVIEW_FEATURES: malware-check

jobs:
  check:
    # protect-main requires this exact name, and GitHub appends matrix values to a name
    # that doesn't use them: 3.12 keeps the bare name, any other version gets its own.
    name: lint, types, tests${{ matrix.python != '3.12' && format(' ({0})', matrix.python) || '' }}
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every version from requires-python up: a library runs on interpreters its
    # author doesn't use.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # No cache: the nightly compat jobs run released Brightway code on hosted runners,
          # and nothing they could write should feed this required check.
          enable-cache: false
          version: "0.13.6"
          python-version: ${{ matrix.python }}

      - run: uv sync --locked
      # Checks every locked dependency, dev group included, against the OSV database
      # for known vulnerabilities and deprecated or quarantined projects. Still
      # experimental in uv, hence the preview flag.
      - run: uv audit --locked --preview-features audit-command

      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest --cov # fails under 80% (`fail_under` in pyproject.toml)

  # The read-count guard needs Brightway, which the job above does not install. This runner is
  # thrown away after the job, so the packages may run on it. The pins are the heads of
  # bw_processing #113 and matrix_utils #48: the guard fails on upstream main by design. Move
  # them to the releases that ship the fixes.
  scaling:
    name: group-count scaling guard
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"
          python-version: "3.12"

      # The tests skip when Brightway is missing, so the import runs first: a broken install
      # must fail this job, not pass it with every test skipped.
      - run: >-
          uv run --locked
          --with git+https://github.com/simonvanlierde/bw_processing@1a6f8982adc6ad9197a3b154a82bb747d6c0a374
          --with git+https://github.com/simonvanlierde/matrix_utils@7335e8a76ae6bd769175bbc650e221e038899afb
          sh -c 'python -c "import bw_processing, matrix_utils.utils" && pytest tests/test_group_scaling.py'
