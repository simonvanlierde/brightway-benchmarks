name: ratios

# `bwbench compare all` on each GitHub-hosted OS, weekly: interleaved ratios with 95% intervals
# between solvers, install paths, Pythons and (macOS, Windows) releases, at smoke size
# (src/bwbench/compare.py, docs/method.md "Hosted ratios"). Each OS writes one result file. The
# attest job checks the files and signs them with a build provenance attestation through
# GitHub's OIDC token; on main the publish job commits them to the `ratios` branch as
# hosted/<YYYY-MM-DD>-<run id>/<OS>.json, never over a published file. `gh attestation verify FILE -R simonvanlierde/brightway-benchmarks`
# proves a file came from this workflow. The site job then rebuilds the site, which reads that branch.

on:
  schedule:
    - cron: "29 2 * * 0" # Sundays 02:29 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    name: ratios on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash # Windows too, under Git Bash
    env:
      # Releases a week old or more, as the rest of the project installs.
      UV_EXCLUDE_NEWER: 1 week
      # Windows Python would otherwise fail printing non-ASCII text to a pipe.
      PYTHONUTF8: "1"
      BWBENCH_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      # The conda-forge arm of install-path. The same pixi as the box's conda stage.
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.82.0
          run-install: false
          cache: false

      # scikit-umfpack has no wheels: it builds against SuiteSparse. On Windows it does not
      # build, so the UMFPACK arm is missing there.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libsuitesparse-dev swig
      - if: runner.os == 'macOS'
        run: brew install suite-sparse swig

      - name: bwbench compare all
        run: |
          PYTHONPATH=src uv run --no-project --python 3.13 python -m bwbench.compare compare all \
            --tier hosted --machine "GitHub $ImageOS" --work "$RUNNER_TEMP/ratio-work" -o "ratios/$RUNNER_OS.json"

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          [ -e "ratios/$RUNNER_OS.json" ] || exit 0
          jq -r '"### Ratios on \(.machine), \(.rounds) rounds\n",
            "| comparison | candidate / baseline | ratio | 95% interval | seconds (baseline) |",
            "| --- | --- | --- | --- | --- |",
            (.comparisons[] | .id as $id | .baseline as $b | .ratios[] |
              "| \($id) | \(.candidate) / \($b) | \(if .missing then "missing: " + .missing else (.ratio * 1000 | round / 1000 | tostring) end) | \(if .ci95 then "\(.ci95[0] * 1000 | round / 1000) to \(.ci95[1] * 1000 | round / 1000)" else "" end) | \(if .seconds then .seconds.baseline else "" end) |"),
            "",
            (.comparisons[] | .id as $id | .arms | to_entries[] | select(.value.missing) | "- \($id) \(.key) missing: \(.value.missing)")' \
            "ratios/$RUNNER_OS.json" >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratios-${{ runner.os }}
          path: ratios/
          if-no-files-found: error

  attest:
    name: check and attest the result files
    needs: measure
    # One OS failing still attests the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # to sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ratios-*
          merge-multiple: true
          path: ratios

      - name: bwbench validate
        run: |
          PYTHONPATH=src uv run --no-project --python 3.13 --with jsonschema==4.26.0 --with rfc3339-validator==0.1.4 \
            python -m bwbench.compare validate ratios/*.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ratios/*.json

  # The files go to the `ratios` branch, which holds data only, as the compat archive does.
  publish:
    name: publish on the ratios branch
    needs: attest
    if: ${{ !cancelled() && needs.attest.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pushes the ratios branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ratios-*
          merge-multiple: true
          path: new

      - name: Commit to the ratios branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          url="https://github.com/$GITHUB_REPOSITORY"
          if git ls-remote --exit-code --heads "$url" ratios >/dev/null; then
            git clone --quiet --branch ratios --single-branch "$url" archive
          else
            git init --quiet -b ratios archive
          fi
          # The day the earliest file started, and this run: a second run that day, or a rerun
          # of this one, never replaces a file that was published and attested.
          day=$(jq -r '.created[:10]' new/*.json | sort | head -n 1)
          dir="archive/hosted/$day-$GITHUB_RUN_ID"
          mkdir -p "$dir"
          for f in new/*.json; do
            if [ -e "$dir/${f##*/}" ]; then
              echo "::notice::$dir/${f##*/} is already published; keeping it"
            else
              cp "$f" "$dir/"
            fi
          done
          cd archive
          git add hosted
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "ratios: $day run $GITHUB_RUN_ID from ${GITHUB_SHA::7}"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/$GITHUB_REPOSITORY" HEAD:ratios

  # A push by the workflow token starts no workflow, so ask for the site build here: it reads the
  # `ratios` branch.
  site:
    name: rebuild the site
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # starts site.yml
    steps:
      - name: Start the site workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main
