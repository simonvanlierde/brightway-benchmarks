name: release

# A pushed vX.Y.Z tag makes the GitHub release: the source archive, its SHA256SUMS and a
# build provenance attestation of both, with the version's CHANGELOG section as notes. The
# attestation's Sigstore bundle is attached as `.intoto.jsonl`, which is what OpenSSF
# Scorecard's Signed-Releases check looks for. Publishing the release makes Zenodo archive
# it (CITATION.cff), and a second job dispatches the site workflow. Nothing goes to PyPI. Do
# not create the release by hand. No workflow_dispatch: a manual run could release from any
# branch.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One group per tag: a re-pushed tag waits for its running release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to create the release
      id-token: write # to sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the history of main, for the next step

      # Publish only a tag signed with a key in .github/allowed_signers on the default
      # branch: .github/scripts/verify-tag.sh says why.
      - name: refuse a tag not signed with an allowed key
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/verify-tag.sh" --fetch "$TAG" "origin/$DEFAULT_BRANCH"

      # A tag pushed on a branch would release code that was never reviewed into main.
      - name: The tagged commit is on main
        run: |
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "The tagged commit $(git rev-parse --short HEAD) is not on main: tag a commit of main"; exit 1; }

      - name: The tag matches pyproject.toml and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v$version" = "$TAG" || { echo "pyproject.toml says $version, the tag is $TAG"; exit 1; }
          awk -v head="## [$version]" '/^## \[/ { if (on) exit; on = index($0, head) == 1; next } on' \
            CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          name=brightway-benchmarks-${TAG#v}
          git archive --prefix="$name/" -o "release/$name.tar.gz" HEAD
          cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
