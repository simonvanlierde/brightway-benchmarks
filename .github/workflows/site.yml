name: site

# Builds the asv history site from the `results` branch and publishes it on GitHub Pages.
# Daily after the nightly compat run (03:41 UTC, a few minutes), so the "works together
# today" table stays current; run it by hand after pushing new results (`just results-commit`
# prints the commands): a push to `results` cannot start it, because that branch holds data
# only, no workflows.

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    # Builds the box image (it only needs asv here), then asv publish per subject,
    # which clones each upstream repository for its tags.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the compat workflow's last green sets (scripts/compat_site.py)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: results
          path: results
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.19"

      # just from PyPI (rust-just), so no extra action is needed.
      - run: uvx --from rust-just==1.58.0 just site
        env:
          GH_TOKEN: ${{ github.token }} # gh, for scripts/compat_site.py

      # The new viewer at ui/, beside the asv pages until it covers them (docs/decisions/0001).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
        env:
          UI_BASE: /brightway-benchmarks/ui/

      - run: |
          mkdir -p site/ui
          cp -r ui/dist/. site/ui/
          uvx --from rust-just==1.58.0 just ui-data site/ui/data

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish on GitHub Pages
    needs: build
    # Only main's scripts may publish: a dispatch on another branch builds, but does not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
