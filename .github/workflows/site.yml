name: site

# Builds the asv history site from the `results` branch and publishes it on GitHub Pages.
# Run it by hand after pushing new results (`just results-commit` prints the commands): a
# push to `results` cannot start it, because that branch holds data only, no workflows.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    # Builds the box image (it only needs asv here; see TODO.md), then asv publish per subject,
    # which clones each upstream repository for its tags.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: results
          path: results
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
          version: "0.12.19"

      # just from PyPI (rust-just), so no extra action is needed.
      - run: uvx --from rust-just==1.58.0 just site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish on GitHub Pages
    needs: build
    # Only main's scripts may publish: a dispatch on another branch builds, but does not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
