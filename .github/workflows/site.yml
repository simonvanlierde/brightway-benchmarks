name: site

# Builds the viewer and its data from the `results`, `compat` and `ratios` branches and publishes
# them on GitHub Pages.
# Daily after the nightly compat run (03:41 UTC, a few minutes), so the compatibility checks
# stay current; GitHub often starts it hours late. A push to main that changes the viewer or
# the scripts that write its data also rebuilds it, so a merged UI change goes live at once.
# Run it by hand after pushing new results (`just results-commit` prints the commands): a push
# to `results` cannot start it, because that branch holds data only, no workflows.

on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "scripts/export_ui.py"
      - "scripts/export_guidance.py"
      - "scripts/export_ratios.py"
      - "ratios/contributed/**"
      - "scripts/probe_site.py"
      - "scripts/release_changes.py"
      - "scripts/change_points.py"
      - "benchmarks/descriptions.toml"
      - "benchmarks/findings.toml"
      - "docs/findings.md"
      - "profiles/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # the python-probe artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # release labels use the exact tag when present

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: results
          path: results
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: "0.13.6"

      # just from PyPI (rust-just), so no extra action is needed.
      - run: uvx --from rust-just==1.58.0 just site

      # The Python support table: the python-probe workflow's newest result per Python and OS. The site
      # deploys without it (the script warns and writes nothing), so a crash here does not stop the build.
      - continue-on-error: true
        run: python3 scripts/probe_site.py site/compat/python-probe.json
        env:
          GH_TOKEN: ${{ github.token }}

      # The viewer serves the homepage and ui/; asv.html and the subject pages redirect to it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The data first: the static pages link only the benchmarks it has (ui/src/lib/build-data.ts).
      - run: uvx --from rust-just==1.58.0 just ui-data site/ui/data

      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: ui
        env:
          UI_BASE: /brightway-benchmarks/ui/
          PUBLIC_DATA_URL: /brightway-benchmarks/ui/data/
          UI_DATA_DIR: ${{ github.workspace }}/site/ui/data

      - run: |
          mkdir -p site/ui
          cp -r ui/dist/. site/ui/
          cp ui/dist/index.html site/index.html
          cp ui/dist/favicon.svg ui/dist/favicon.ico ui/dist/og.png ui/dist/apple-touch-icon.png site/
          cp -r ui/dist/about site/about
          cp -r ui/dist/findings site/findings
          cp -r ui/dist/stories site/stories
          cp ui/dist/sitemap.xml site/sitemap.xml
          cp ui/dist/404.html site/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: publish on GitHub Pages
    needs: build
    # Only main's scripts may publish: a dispatch on another branch builds, but does not deploy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
