name: smoke

# `just smoke` in the benchmark box: every benchmark imports, runs and passes its
# checks at the oldest and latest release of its subject. The timings come from a shared runner
# and are not results. Weekly, so an environment that stops building or a broken
# check shows up without anyone running it by hand. New upstream releases are not
# picked up: the releases come from asv/*.hashes.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  smoke:
    name: smoke run
    runs-on: ubuntu-latest
    # Builds every asv environment from scratch, scikit-umfpack from source included.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: "0.13.6"

      # just from PyPI (rust-just), so no extra action is needed.
      - run: uvx --from rust-just==1.58.0 just smoke
