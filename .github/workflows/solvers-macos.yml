name: solvers-macos

# `scripts/solver_lci.py` on an Apple Silicon runner, where PyPardiso cannot install and
# bw2calc falls back to SuperLU. Run it by hand. Hosted runners share their machines, so
# the times are a rough column next to the benchmark machine's, not results.

on:
  workflow_dispatch:
    inputs:
      size:
        description: profile
        type: choice
        options: [ecoinvent, smoke]
        default: ecoinvent
      bw2calc:
        description: bw2calc release
        type: choice
        options: ["3.1.0", "3.0.0"]
        default: "3.1.0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  solvers:
    name: ${{ matrix.solver }} on macos-14
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        solver: [superlu, klu, umfpack, umfpack-T]
    env:
      BWBENCH_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          version: "0.12.19"

      # scikit-umfpack has no wheels: it builds against Homebrew's SuiteSparse.
      - if: startsWith(matrix.solver, 'umfpack')
        run: brew install suite-sparse swig

      - shell: bash # pipefail, so the tee below keeps the script's exit code
        env:
          SOLVER: ${{ matrix.solver }}
          SIZE: ${{ inputs.size }}
          BW2CALC: ${{ inputs.bw2calc }}
        run: |-
          extra=()
          case "$SOLVER" in
            klu) extra=(--with pyklu==0.2.0) ;;
            umfpack*) extra=(--with scikit-umfpack==0.4.2) ;;
          esac
          echo '```' >>"$GITHUB_STEP_SUMMARY"
          trap 'echo "\`\`\`" >>"$GITHUB_STEP_SUMMARY"' EXIT # close the block even on failure
          if [[ $SOLVER == umfpack* ]]; then brew list --versions suite-sparse | tee -a "$GITHUB_STEP_SUMMARY"; fi
          PYTHONPATH=src uv run -q --no-project --python 3.12 \
            --exclude-newer-package bw2calc=2026-10-19 --with "bw2calc==$BW2CALC" --with threadpoolctl==3.7.0 \
            --with numpy==2.5.3 --with scipy==1.18.1 "${extra[@]}" \
            python scripts/solver_lci.py "$SOLVER" "$SIZE" | tee -a "$GITHUB_STEP_SUMMARY"
