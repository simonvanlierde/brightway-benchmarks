name: ui

# The benchmark UI in ui/. Its check is required, so the workflow runs on every pull request
# and the check job is skipped, which counts as passing, when the pull request touches none of
# the paths below. A paths filter on the trigger would leave the required check pending instead.
on:
  push:
    branches: [main]
    paths: [ui/**, scripts/export_ui.py, .github/workflows/ui.yml]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: ui changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # to list the pull request's files
    outputs:
      ui: ${{ steps.files.outputs.ui }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |-
          set -euo pipefail
          if [ -z "$PR" ]; then
            echo "ui=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          if grep -qE '^(ui/|scripts/export_ui\.py$|\.github/workflows/ui\.yml$)' <<<"$files"; then
            echo "ui=true" >>"$GITHUB_OUTPUT"
          else
            echo "ui=false" >>"$GITHUB_OUTPUT"
          fi

  check:
    # main-checks requires this exact name.
    name: "ui: lint, types, tests, build"
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only `run:` steps take this. pnpm/action-setup reads `packageManager` from ui/package.json,
    # and setup-node hashes ui/pnpm-lock.yaml to key its cache.
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # The types are generated from ui/schema/; this fails when the committed ones are stale.
      - run: pnpm run types && git diff --exit-code src/lib
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      # Known advisories, moderate and up, in what ships: dependencies, not dev tooling.
      - run: pnpm audit --prod --audit-level=moderate
