name: ui

# Runs on every pull request, since its check is required.
on:
  push:
    branches: [main]
    paths: [ui/**, scripts/export_ui.py, .github/workflows/ui.yml]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # main-checks requires this exact name.
    name: "ui: lint, types, tests, build"
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only `run:` steps take this, so the setup actions name ui/ themselves.
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ui/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      # Fails when the committed types are stale.
      - run: pnpm run types && git diff --exit-code src/lib
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run build
      # What a page loads, gzipped, against the budget in scripts/size.mjs.
      - run: pnpm run size
      # Advisories, moderate and up, in what ships.
      - run: pnpm audit --prod --audit-level=moderate
      # Browser tests on the built site with the real fixture data: keyboard, URL state, axe, screenshots.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e
        env:
          SHOTS: test-results/shots
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: ui/test-results/
          retention-days: 14
