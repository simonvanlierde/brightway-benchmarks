# The name the viewer shows for a parameter.
[labels.params]
size       = "Synthetic database"
cls        = "Calculation class"
demands    = "Functional units"
variant    = "Scoring"
iterations = "Draws"
refinement = "Iterative refinement"
max_calc   = "Calculation limit"
entries    = "Matrix entries"
groups     = "Resource groups"
steps      = "Yearly steps"

# The name the viewer shows for a group; its id and URLs keep the group's own name.
[labels.groups]
"bw2calc-conda" = "bw2calc (conda-forge)"

# One note per series under the chart, by the environment's solver label, for the solvers
# bw2calc cannot pick: src/bwbench/solvers.py patches them in.
[notes.environments]
KLU = "KLU: pyklu's sparse solver, which splits the matrix into blocks before factorizing A. bw2calc has no KLU path, so the benchmarks patch it in as the solver (x86_64 only)."
"UMFPACK on Aᵀ" = "UMFPACK on Aᵀ: scikit-umfpack factorizing Aᵀ instead of A, which leaves less fill-in on LCA matrices. bw2calc 3.1.0 does this itself; for the other releases the benchmarks patch it in."

# One line under a subject's name in the catalogue: what it times, or what sets it apart.
[groups]
bw2calc         = "NumPy, SciPy and the solvers from PyPI wheels."
"bw2calc-conda" = "NumPy, SciPy and the solvers from conda-forge, on OpenBLAS or MKL."
bw2data         = "Writing a database into a project."
bw_graph_tools  = "Supply chain graph traversal."
bw_processing   = "Adding entries to datapackages and listing their resources."
bw_timex        = "Time-explicit inventories over two background databases."
matrix_utils    = "Building matrices from datapackages."

# A parameter's meaning, the same in every benchmark that has it.
[params]
size       = "The synthetic system the case runs on."
cls        = "The bw2calc class that does the calculation."
demands    = "How many functional units are calculated together."
variant    = "How the scores are calculated."
iterations = "How many Monte Carlo draws are timed after the first score."
refinement = "UMFPACK's iterative refinement after each solve."
max_calc   = "The most calculations the traversal may make."
entries    = "How many matrix entries are added."
groups     = "How many resource groups the datapackage holds, one matrix entry each."
steps      = "How many yearly steps each background exchange is spread over."

# A parameter value's meaning, by parameter and value as the viewer shows it.
[values.size]
smoke     = "200 products: a quick check that the case runs."
useeio    = "388 products and 1,871 elementary flows, shaped like USEEIO 1.1."
ecoinvent = "26,533 products and 4,000 elementary flows, shaped like ecoinvent 3.12 cut-off."

[values.cls]
LCA            = "Solves directly, factorizing the technosphere matrix; Monte Carlo refactorizes on every draw."
IterativeLCA   = "Factorizes once and reuses that factorization for later solves."
JacobiGMRESLCA = "Solves by GMRES with a Jacobi preconditioner and never factorizes."

[values.variant]
MultiLCA = "bw2calc's MultiLCA, which keeps each demand's full inventory."
forward  = "FastScoresOnlyMultiLCA, solving one system per demand and keeping only scores."
adjoint  = "FastScoresOnlyMultiLCA, solving one transposed system per impact method instead of one per demand."

[values.refinement]
on  = "UMFPACK's default: it refines the solution after solving."
off = "Refinement turned off (UMFPACK_IRSTEP=0)."

# Where a reader looks a term up: docs.brightway.dev where it has a page, otherwise the project's
# own. The viewer links the term itself. A benchmark links its source file, which
# scripts/export_ui.py finds from asv's benchmark_dir, so it needs no entry here.
# A subject has docs (its name in the viewer links there), source, changelog and issues (the open
# issues and pull requests the author of these benchmarks opened; issue 85 of this repository lists them).
[links.groups.bw2calc]
docs      = "https://docs.brightway.dev/en/latest/content/api/bw2calc/index.html"
source    = "https://github.com/brightway-lca/brightway2-calc"
changelog = "https://github.com/brightway-lca/brightway2-calc/blob/main/CHANGES.md"
issues    = "https://github.com/brightway-lca/brightway2-calc/issues?q=is%3Aopen+author%3Asimonvanlierde"

[links.groups."bw2calc-conda"]
docs      = "https://docs.brightway.dev/en/latest/content/api/bw2calc/index.html"
source    = "https://github.com/brightway-lca/brightway2-calc"
changelog = "https://github.com/brightway-lca/brightway2-calc/blob/main/CHANGES.md"
issues    = "https://github.com/brightway-lca/brightway2-calc/issues?q=is%3Aopen+author%3Asimonvanlierde"

[links.groups.bw2data]
docs      = "https://docs.brightway.dev/en/latest/content/api/bw2data/index.html"
source    = "https://github.com/brightway-lca/brightway2-data"
changelog = "https://github.com/brightway-lca/brightway2-data/blob/main/CHANGES.md"
issues    = "https://github.com/brightway-lca/brightway2-data/issues?q=is%3Aopen+author%3Asimonvanlierde"

[links.groups.bw_graph_tools]
docs      = "https://docs.brightway.dev/projects/graphtools/en/latest/"
source    = "https://github.com/brightway-lca/bw_graph_tools"
changelog = "https://github.com/brightway-lca/bw_graph_tools/blob/main/CHANGES.md"
issues    = "https://github.com/brightway-lca/bw_graph_tools/issues?q=is%3Aopen+author%3Asimonvanlierde"

[links.groups.bw_processing]
docs      = "https://docs.brightway.dev/projects/bw-processing/en/latest/"
source    = "https://github.com/brightway-lca/bw_processing"
changelog = "https://github.com/brightway-lca/bw_processing/blob/main/CHANGES.md"
issues    = "https://github.com/brightway-lca/bw_processing/issues?q=is%3Aopen+author%3Asimonvanlierde"

[links.groups.bw_timex]
docs      = "https://docs.brightway.dev/projects/bw-timex/en/latest/"
source    = "https://github.com/brightway-lca/bw_timex"
changelog = "https://github.com/brightway-lca/bw_timex/blob/main/CHANGES.md"
