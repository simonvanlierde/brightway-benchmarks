[links.groups.matrix_utils]
docs      = "https://matrixutils.readthedocs.io/en/latest/"
source    = "https://github.com/brightway-lca/matrix_utils"
changelog = "https://github.com/brightway-lca/matrix_utils/blob/main/CHANGELOG.md"
issues    = "https://github.com/brightway-lca/matrix_utils/issues?q=is%3Aopen+author%3Asimonvanlierde"

# By the solver an environment's label starts with ("UMFPACK, MKL" and "UMFPACK on Aᵀ" are UMFPACK).
[links.solvers]
UMFPACK   = "https://scikit-umfpack.github.io/scikit-umfpack/"
PyPardiso = "https://github.com/haasad/PyPardiso"
KLU       = "https://pypi.org/project/pyklu/"
SuperLU   = "https://docs.scipy.org/doc/scipy/reference/generated/scipy.sparse.linalg.splu.html"

[links.values.size]
smoke     = "https://github.com/simonvanlierde/brightway-benchmarks/blob/main/docs/method.md#the-synthetic-databases"
ecoinvent = "https://github.com/simonvanlierde/brightway-benchmarks/blob/main/docs/method.md#the-synthetic-databases"
exiobase  = "https://github.com/simonvanlierde/brightway-benchmarks/blob/main/docs/method.md#the-synthetic-databases"
useeio    = "https://github.com/simonvanlierde/brightway-benchmarks/blob/main/docs/method.md#the-real-database"

[links.values.cls]
LCA            = "https://docs.brightway.dev/en/latest/content/api/bw2calc/lca/index.html#bw2calc.lca.LCA"
IterativeLCA   = "https://docs.brightway.dev/en/latest/content/api/bw2calc/iterative_lca/index.html#bw2calc.iterative_lca.IterativeLCA"
JacobiGMRESLCA = "https://docs.brightway.dev/en/latest/content/api/bw2calc/jacobi_gmres_lca/index.html#bw2calc.jacobi_gmres_lca.JacobiGMRESLCA"

[links.values.variant]
MultiLCA = "https://docs.brightway.dev/en/latest/content/api/bw2calc/multi_lca/index.html#bw2calc.multi_lca.MultiLCA"
forward  = "https://docs.brightway.dev/en/latest/content/api/bw2calc/fast_scores/index.html#bw2calc.fast_scores.FastScoresOnlyMultiLCA"
adjoint  = "https://docs.brightway.dev/en/latest/content/api/bw2calc/fast_scores/index.html#bw2calc.fast_scores.FastScoresOnlyMultiLCA"

# The parameter values CodSpeed runs, where they differ from the first value asv lists (the
# codspeed workflow sets BWBENCH_SIZES=smoke). The viewer links each benchmark's case with them.
# `skip` lists benchmarks CodSpeed never runs: the refinement case needs bw2calc to solve with
# UMFPACK, and the codspeed job installs PyPardiso, which bw2calc picks first.
[codspeed]
params = { size = "smoke" }
skip = ["bench_lca.NewDemandRefinement.time_redo_lci_refinement"]
