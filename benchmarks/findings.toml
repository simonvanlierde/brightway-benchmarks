# The findings the viewer leads with, each opening the history that shows it. docs/findings.md
# holds the full account; `doc` names its section. scripts/export_ui.py copies these into
# index.json and fails when a benchmark, group or parameter value no longer exists.
# `params` names a value (as the viewer shows it) for each parameter the view should fix, in the
# benchmark's axis order with none skipped: /findings/ builds its links from this order.
# `profile` (optional) links a profile of the case: an https URL, or the name of an .html file in
# profiles/, which `just site` publishes (`just profile` writes it to .asv/profiles/).
# `story` (optional) names the story that tells the finding in full: ui/src/pages/stories/<story>.astro.
# A finding a story tells may leave out group, benchmark and params until its benchmarks publish:
# /findings/ lists it, the viewer does not.

[[findings]]
title = "The solver sets the time for one score"
text = "On an ecoinvent-sized database, UMFPACK on OpenBLAS takes 1.03 s, PyPardiso 2.22 s and SciPy's SuperLU 4.98 s."
group = "bw2calc-conda"
benchmark = "bench_lca.SingleScore.time_first_score"
params = { size = "ecoinvent", cls = "LCA" }
doc = "the-solver-sets-the-time-for-one-score"
story = "solver-choice"

[[findings]]
title = "bw2calc 3.0.0 slowed IterativeLCA, and 3.1.0 fixed it"
text = "One score took 31.3 s instead of 2.54 s with UMFPACK, and 2.1 minutes instead of 4.98 s with SuperLU."
group = "bw2calc"
benchmark = "bench_lca.SingleScore.time_first_score"
params = { size = "ecoinvent", cls = "IterativeLCA" }
doc = "bw2calc-300-slowed-iterativelca-without-pypardiso-and-310-fixed-it"
profile = "bw2calc-300-iterativelca-umfpack.html"

[[findings]]
title = "bw2calc 3.0.0 doubled JacobiGMRESLCA's Monte Carlo time"
text = "Ten draws take 0.65 s instead of 0.338 s with every solver, and 3.1.0 has not fixed it."
group = "bw2calc"
benchmark = "bench_lca.MonteCarlo.time_iterations"
params = { size = "ecoinvent", iterations = "10", cls = "JacobiGMRESLCA" }
doc = "bw2calc-300-doubled-jacobigmreslcas-monte-carlo-time"

[[findings]]
title = "bw_timex 1.3.0 made the time-explicit LCI about 19 times slower"
text = "1.3.2 fixed it and 1.4.0 is faster again: use 1.4.0 or later."
group = "bw_timex"
benchmark = "bench_timex.TimelineLCI.time_lci"
params = {}
doc = "bw_timex-130-made-the-time-explicit-lci-about-19-times-slower"

[[findings]]
title = "bw_graph_tools 0.9 made traversal up to 6 times faster"
text = "Batched scoring took a 2-calculation EXIOBASE traversal from 1.19 minutes to 12.0 s."
group = "bw_graph_tools"
benchmark = "bench_traversal.Traversal.time_traverse"
params = { size = "exiobase", max_calc = "2" }
doc = "bw_graph_tools-09-made-traversal-up-to-6-times-faster"

[[findings]]
title = "A correct solve can still score the wrong inventory"
text = "A benchmark that only checks the linear solve can pass while the inventory or the impact factors are wrong. The heating model checks both beside its timings."
doc = "a-correct-solve-can-still-score-the-wrong-inventory"
story = "home-heating"
