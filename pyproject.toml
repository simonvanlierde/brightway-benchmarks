[project]
name = "brightway-benchmarks"
version = "0.1.0"
description = "Benchmarks for the Brightway LCA stack on seeded synthetic matrices"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Simon van Lierde", email = "code@duinlab.nl" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]
# PyPI rejects unknown classifiers, so this one blocks an accidental upload.
# Delete it (and set publish_to_pypi) to publish.
classifiers = ["Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/simonvanlierde/brightway-benchmarks"
Issues = "https://github.com/simonvanlierde/brightway-benchmarks/issues"

[dependency-groups]
dev = [
  "hypothesis>=6.169.1",
  "jsonschema>=4.26.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "rfc3339-validator>=0.1.4",
  "ruff>=0.17.1",
  "ty>=0.0.89",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

# Resolve only releases at least a week old: a compromised release is usually
# caught and yanked within that window. The dependency bot waits the same week.
# Set here, not user-wide, so every machine writes the same uv.lock.
[tool.uv]
exclude-newer = "1 week"

# uv_build derives the package dir from the normalized project.name, so pin it
# for a module_name that differs.
[tool.uv.build-backend]
module-name = "bwbench"

# NOTE: self-contained ruff config, deliberately not extended from any shared base.
# No target-version: ruff derives it from requires-python above.
[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN204", # missing-return-type-special-method
  "COM812", # trailing-comma-missing: conflicts with the formatter
  "CPY001", # missing copyright notice
  "D105",   # undocumented-magic-method
  "D107",   # undocumented-public-init
  "TD002",  # missing-todo-author: a plain `# TODO:` is enough
  "TD003",  # missing-todo-link
]

# Tests assert, use literal expectations, and need no docstrings, return
# annotations, or package __init__.py.
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S603", "D1", "INP001", "PLR2004", "ANN201", "ANN202", "ARG001"]
# The seam passes runners' objects and benchmark results through untyped (ANN401), and
# asv calls every method with the parameters (ARG001).
"src/bwbench/{asv,bench,pytest}.py" = ["ANN401", "ARG001"]
# asv's conventions: every method gets the parameters (ARG002), `params` are class lists
# (RUF012), and a benchmark's name is its documentation (D1). Checks raise plain errors.
"benchmarks/**" = ["ARG002", "RUF012", "D1", "EM101", "EM102", "TRY003", "PLR2004", "DTZ001"]
"scripts/**" = ["INP001", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str"]
max-args = 10

# A rule set to "warn" reports without failing: ty otherwise exits 1 on warnings too.
[tool.ty.terminal]
error-on-warning = false

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
# pytest-codspeed registers it in the benchmark runs; the unit tests only check it is set.
markers = ["benchmark: a benchmark for pytest-codspeed"]
testpaths = ["tests"]

# Coverage is opt-in via `pytest --cov` (`just py-cov`), not addopts, because it
# slows every plain test run. The tests run most scripts as subprocesses, which
# `patch` measures too. The omitted scripts need Brightway, so they run only in
# the box, where `just smoke` exercises them.
[tool.coverage.run]
source = ["src", "scripts"]
omit = [
  "*/scripts/bw2io_import.py",
  "*/scripts/registry_vs_sqlite.py",
  "*/scripts/solver_factorize.py",
  "*/scripts/solver_lci.py",
]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Brightway packages are never installed on the host: they run only inside the box,
# where asv installs them per environment. So the type check covers our own code.
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.analysis]
allowed-unresolved-imports = ["bw_processing", "bw2calc", "pypardiso.**", "scikits.**", "PyKLU", "otava.**"]
