# Its own workspace root, so ui/ can move into a repository of its own.
# Resolve only releases at least two weeks old, transitive ones included.
# Renovate's security updates skip its own wait but not this one: a fix younger than two weeks
# needs a dated `minimumReleaseAgeExclude: [pkg@version]` entry by hand, removed once it matures.
minimumReleaseAge: 20160
