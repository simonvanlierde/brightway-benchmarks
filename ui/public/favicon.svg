<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Brightway Benchmarks</title>
  <rect width="32" height="32" fill="#141d32" />
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#2a3755" stroke-width="1" />
  <!-- Benchmark baseline -->
  <line x1="4" y1="26" x2="28" y2="26" stroke="#3d4d70" stroke-width="1.2" />
  <!-- Benchmark Bar 1: SuperLU baseline (grey-blue) -->
  <rect x="5.5" y="18" width="4.5" height="8" fill="#6b7fa9" />
  <!-- Benchmark Bar 2: PyPardiso (series blue) -->
  <rect x="12" y="12" width="4.5" height="14" fill="#b3c5ff" />
  <!-- Position 3: Brightway Triangulated Leaf (optimal) -->
  <!-- Facet fills with tonal variation -->
  <polygon points="18.5,25.5 15.5,18 20,18" fill="#74cfc3" fill-opacity="0.35" />
  <polygon points="18.5,25.5 20,18 25,22" fill="#74cfc3" fill-opacity="0.25" />
  <polygon points="20,18 25,22 27.5,16" fill="#74cfc3" fill-opacity="0.45" />
  <polygon points="15.5,18 17.5,11 22,12" fill="#74cfc3" fill-opacity="0.5" />
  <polygon points="15.5,18 20,18 22,12" fill="#74cfc3" fill-opacity="0.3" />
  <polygon points="20,18 22,12 27.5,16" fill="#74cfc3" fill-opacity="0.4" />
  <polygon points="22,12 27.5,16 27,10" fill="#74cfc3" fill-opacity="0.6" />
  <polygon points="17.5,11 25.5,5 22,12" fill="#74cfc3" fill-opacity="0.75" />
  <polygon points="22,12 25.5,5 27,10" fill="#74cfc3" fill-opacity="0.85" />
  <!-- Leaf contour and triangulation wireframe (Brightway signature) -->
  <g stroke="#f8f9fc" stroke-width="0.75" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 18.5 25.5 C 14.5 18 17 9 25.5 5 C 29 11 29 21 18.5 25.5 Z" stroke-width="1.1" stroke="#f8f9fc" />
    <line x1="18.5" y1="25.5" x2="25.5" y2="5" stroke-width="1.2" stroke="#f8f9fc" />
    <line x1="15.5" y1="18" x2="20" y2="18" />
    <line x1="20" y1="18" x2="27.5" y2="16" />
    <line x1="17.5" y1="11" x2="22" y2="12" />
    <line x1="22" y1="12" x2="27" y2="10" />
    <line x1="18.5" y1="25.5" x2="25" y2="22" />
    <line x1="25" y1="22" x2="27.5" y2="16" />
  </g>
  <!-- Benchmark measurement target node at apex -->
  <rect x="24.5" y="4" width="2" height="2" fill="#f8f9fc" />
</svg>
