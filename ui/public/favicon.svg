<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Brightway Benchmarks</title>
  <rect width="32" height="32" fill="#141d32" />
  <rect x="0.5" y="0.5" width="31" height="31" fill="none" stroke="#2a3755" stroke-width="1" />
  <!-- Baseline rule -->
  <line x1="5" y1="25" x2="27" y2="25" stroke="#3d4d70" stroke-width="1.5" />
  <!-- Benchmark columns: SuperLU (baseline), PyPardiso (intermediate), UMFPACK (optimal) -->
  <rect x="6" y="18" width="5" height="7" fill="#6b7fa9" />
  <rect x="13.5" y="12" width="5" height="13" fill="#b3c5ff" />
  <rect x="21" y="6" width="5" height="19" fill="#74cfc3" />
  <!-- Benchmark dot on top of the fastest column -->
  <rect x="22.5" y="7.5" width="2" height="2" fill="#f8f9fc" />
</svg>
